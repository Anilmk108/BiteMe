splay:grid;grid-template-columns:1fr 1fr;gap:7px}.role-select label{border:1px solid var(--line);border-radius:5px;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:12px}.role-select input{accent-color:var(--green)}.cart-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:20px;align-items:start}.cart-row{display:grid;grid-template-columns:62px minmax(100px,1fr) auto auto;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.cart-row:last-child{border-bottom:0}.cart-row img{width:62px;height:56px;object-fit:cover;border-radius:5px}.cart-row h3{font:600 15px "Playfair Display",serif;margin:0 0 3px}.cart-row p{font-size:12px;color:var(--muted);margin:0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:25px;height:25px;background:white;border:1px solid var(--line);border-radius:4px}.summary-line{display:flex;justify-content:space-between;padding:8px 0;color:#66736a}.summary-total{border-top:1px solid var(--line);margin-top:7px;padding-top:14px;font-weight:700;color:var(--ink)}.toast{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--green-dark);color:white;padding:12px 17px;border-radius:6px;box-shadow:var(--shadow);animation:toast-in .2s ease-out}.hidden{display:none!important}.mobile-nav{display:none}@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-width:980px){.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:28px 25px 45px}}@media(max-width:700px){.topbar{padding:0 16px;height:60px}.top-note{display:none}.brand{font-size:17px}.layout{display:block;min-height:calc(100vh - 60px)}.sidebar{display:none}.main{padding:23px 16px 92px}.mobile-nav{position:fixed;z-index:6;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-aroun   <style>
    .whatsapp-settings{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin-bottom:20px}.whatsapp-settings h2{font:600 19px "Playfair Display",serif;margin:0 0 4px}.whatsapp-settings p,.whatsapp-settings small{color:var(--muted);font-size:12px;margin:0}.whatsapp-settings form{display:grid;gap:7px}.whatsapp-settings label{font-size:12px;font-weight:700}.whatsapp-settings input,.rider-form input{min-width:0;height:35px;border:1px solid var(--line);border-radius:5px;padding:0 9px}.order-tools{display:grid;justify-items:start;gap:8px;margin-top:8px}.rider-form{display:flex;gap:6px;max-width:100%}.rider-form input{width:min(270px,48vw)}.order-tools .btn:disabled{opacity:.7;cursor:default}.franchise-select{max-width:210px;height:39px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:0 9px;font-weight:600}@media(max-width:700px){.whatsapp-settings{grid-template-columns:1fr;gap:12px}.rider-form{flex-wrap:wrap}.rider-form input{width:100%}.order-tools{justify-items:stretch}.order-tools>.btn{justify-self:start}.franchise-select{max-width:130px;height:36px;font-size:11px}}
  </style>

<body>
  <div id="app" class="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
    (() => {
      const STORAGE = { products: "gg_products_v1", orders: "gg_orders_v1", cart: "gg_cart_v1", user: "gg_user_v1" };
      const seedProducts = [
        { id: "p1", name: "Garden grain bowl", category: "Mains", price: 14, stock: 18, tag: "House favorite", description: "Herbed grains, roasted market vegetables, greens, and bright lemon tahini.", image: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80", active: true },
        { id: "p2", name: "Sunday roast chicken", category: "Mains", price: 21, stock: 12, tag: "Made to share", description: "Slow-roasted chicken, crispy potatoes, seasonal greens, and pan jus.", image: "https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?auto=format&fit=crop&w=800&q=80", active: true },
        { id: "p3", name: "Berry & cream cup", category: "Desserts", price: 9, stock: 16, tag: "Save room", description: "Local berries, softly whipped vanilla cream, and a little oat crumble.", image: "https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=800&q=80", active: true },
        { id: "p4", name: "Market tomato toast", category: "Small plates", price: 11, stock: 14, tag: "Seasonal", description: "Grilled sourdough, ripe tomatoes, whipped ricotta, and garden herbs.", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=800&q=80", active: true },
        { id: "p5", name: "Citrus olive cake", category: "Desserts", price: 8, stock: 10, tag: "Baked today", description: "A tender olive oil cake finished with orange zest and soft cream.", image: "https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=800&q=80", active: true },
        { id: "p6", name: "Ginger lemonade", category: "Drinks", price: 5, stock: 24, tag: "House-made", description: "Fresh lemon, a little ginger, and just enough sparkle.", image: "https://images.unsplash.com/photo-1513558161293-cdab7657a4e7?auto=format&fit=crop&w=800&q=80", active: true }
      ];
      const sampleFranchises = [
        { id: "juniper-table", name: "Juniper Table", adminEmail: "juniper@example.com", adminPassword: "juniper123", whatsappPhone: "", cart: [], orders: [], products: [
          { id: "jt1", name: "Maple squash bowl", category: "Mains", price: 15, stock: 14, tag: "Seasonal", description: "Roasted squash, wild rice, greens, and maple cider dressing.", image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=800&q=80", active: true },
          { id: "jt2", name: "Herb-roasted chicken", category: "Mains", price: 19, stock: 10, tag: "Juniper favorite", description: "Herb-roasted chicken with crispy potatoes and market greens.", image: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=800&q=80", active: true },
          { id: "jt3", name: "Lemon olive cake", category: "Desserts", price: 8, stock: 12, tag: "Baked today", description: "Bright lemon cake with olive oil, berries, and soft cream.", image: "https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=800&q=80", active: true }
        ] },
        { id: "harbor-hearth", name: "Harbor & Hearth", adminEmail: "harbor@example.com", adminPassword: "harbor123", whatsappPhone: "", cart: [], orders: [], products: [
          { id: "hh1", name: "Harbor fish tacos", category: "Mains", price: 18, stock: 16, tag: "Harbor favorite", description: "Crispy fish, cabbage slaw, lime, and warm corn tortillas.", image: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=800&q=80", active: true },
          { id: "hh2", name: "Hearth mushroom toast", category: "Small plates", price: 13, stock: 11, tag: "Made to share", description: "Wild mushrooms over grilled sourdough with herbs and whipped ricotta.", image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=800&q=80", active: true },
          { id: "hh3", name: "Berry oat crumble", category: "Desserts", price: 9, stock: 9, tag: "Warm from the oven", description: "Baked seasonal berries with a crisp oat topping and vanilla cream.", image: "https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?auto=format&fit=crop&w=800&q=80", active: true }
        ] }
      ];
      const load = (key, fallback) => { try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : fallback; } catch { return fallback; } };
      const franchiseStorage = "gg_franchises_v1";
      let franchises = load(franchiseStorage, null);
      if (!Array.isArray(franchises) || !franchises.length) {
        franchises = [{ id: "gather-grain", name: "Gather & Grain", adminEmail: "admin@example.com", adminPassword: "admin123", products: load(STORAGE.products, seedProducts), orders: load(STORAGE.orders, []).map(order => ({ ...order, franchiseId: order.franchiseId || "gather-grain" })), whatsappPhone: load("gg_settings_v1", { whatsappPhone: "" }).whatsappPhone || "", cart: [] }];
        localStorage.setItem(franchiseStorage, JSON.stringify(franchises));
      }
      for (const sample of sampleFranchises) {
        if (!franchises.some(franchise => franchise.id === sample.id)) franchises.push(sample);
      }
      localStorage.setItem(franchiseStorage, JSON.stringify(franchises));
      let activeFranchiseId = load("gg_active_franchise_v1", franchises[0].id);
      let products = [];
      let orders = [];
      let settings = { whatsappPhone: "" };
      let cart = [];
      let user = load(STORAGE.user, null);
      let view = "menu";
      let category = "All items";
      let searchTerm = "";
      let modal = "";
      const money = value => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(value);
      const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      const currentFranchise = () => franchises.find(franchise => franchise.id === activeFranchiseId) || franchises[0];
      const activateFranchise = id => {
        const franchise = franchises.find(item => item.id === id);
        if (!franchise) return false;
        activeFranchiseId = franchise.id;
        products = franchise.products || [];
        orders = franchise.orders || [];
        settings = { whatsappPhone: franchise.whatsappPhone || "" };
        cart = franchise.cart || [];
        localStorage.setItem("gg_active_franchise_v1", activeFranchiseId);
        return true;
      };
      const persist = () => { const franchise = currentFranchise(); franchise.products = products; franchise.orders = orders; franchise.whatsappPhone = settings.whatsappPhone || ""; franchise.cart = cart; localStorage.setItem(franchiseStorage, JSON.stringify(franchises)); };
      const cartCount = () => cart.reduce((sum, item) => sum + item.qty, 0);
      const subtotal = () => cart.reduce((sum, item) => sum + (products.find(product => product.id === item.id)?.price || 0) * item.qty, 0);
      const statusClass = status => status === "Pending" ? "pending" : status === "Cancelled" ? "cancelled" : "";
      const whatsappLink = order => `https://wa.me/${String(settings.whatsappPhone || "").replace(/\D/g, "")}?text=${encodeURIComponent(`Hello, I would like to arrange manual payment for order ${order.id}. Total: ${money(order.total)}.`)}`;
      const visibleOrders = () => user?.role === "admin" ? orders : orders.filter(order => order.email === user?.email && order.franchiseId === activeFranchiseId);
      const menuItems = () => products.filter(product => product.active && product.stock > 0 && (category === "All items" || product.category === category) && (product.name + " " + product.description).toLowerCase().includes(searchTerm.toLowerCase()));
      const navItems = () => user?.role === "platform-admin" ? [["franchises", "▦", "Franchises"]] : user?.role === "admin" ? [["dashboard", "▦", "Overview"], ["orders", "▤", "Orders"], ["products", "◫", "Menu items"]] : [["menu", "⌂", "Menu"], ["cart", "▣", `Your cart ${cartCount() ? `(${cartCount()})` : ""}`], ["orders", "▤", "Your orders"]];
      if (user?.role === "admin") {
        const ownedFranchise = franchises.find(franchise => franchise.id === user.franchiseId || franchise.adminEmail.toLowerCase() === user.email.toLowerCase());
        if (ownedFranchise) { user.franchiseId = ownedFranchise.id; activeFranchiseId = ownedFranchise.id; localStorage.setItem(STORAGE.user, JSON.stringify(user)); }
      }
      activateFranchise(activeFranchiseId);
      function render() {
        const nav = navItems().map(([id, icon, label]) => `<button class="nav-item ${view === id ? "active" : ""}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join("");
        document.getElementById("app").innerHTML = `<header class="topbar"><a class="brand" href="#" data-view="menu"><span class="brand-mark">G</span>Gather <em>&amp;</em> Grain</a><div class="top-actions"><span class="top-note">Neighborhood kitchen · Open today until 9 pm</span>${user ? `<button class="btn" data-view="${user.role === "admin" ? "dashboard" : "cart"}">${user.role === "admin" ? "Admin" : "Cart"}${user.role !== "admin" && cartCount() ? ` <span class="cart-count">${cartCount()}</span>` : ""}</button><button class="btn btn-quiet" data-action="logout">Sign out</button>` : `<button class="btn" data-action="login">Sign in</button>`}</div></header><div class="layout"><aside class="sidebar"><div class="side-label">${user?.role === "admin" ? "Workspace" : "Order online"}</div><nav class="side-nav">${nav}</nav><div class="side-bottom">${user ? `Signed in as<br><strong>${esc(user.name)}</strong><br>${esc(user.email)}` : `Browsing as a guest<br><button class="btn btn-small" data-action="login" style="margin-top:10px">Sign in to order</button>`}<br><br>Demo experience. Data is saved only in this browser.</div></aside><main class="main">${renderView()}</main><nav class="mobile-nav">${nav}</nav></div>`;
        const brand = document.querySelector(".brand");
        if (brand) brand.innerHTML = `<span class="brand-mark">${esc(currentFranchise().name.slice(0, 1))}</span>${esc(currentFranchise().name)}`;
        if (user?.role === "platform-admin") { const shortcut = document.querySelector(".top-actions [data-view]"); if (shortcut) { shortcut.dataset.view = "franchises"; shortcut.textContent = "Platform admin"; } }
        const actions = document.querySelector(".top-actions");
        if (actions && (!user || user.role === "customer")) actions.insertAdjacentHTML("afterbegin", `<select class="franchise-select" aria-label="Choose restaurant">${franchises.map(franchise => `<option value="${esc(franchise.id)}" ${franchise.id === activeFranchiseId ? "selected" : ""}>${esc(franchise.name)}</option>`).join("")}</select>`);
        document.getElementById("modal-root").innerHTML = modal === "login" ? loginModal() : modal === "checkout" ? checkoutModal() : modal === "product" || modal.startsWith("product:") ? productModal() : modal === "franchise" ? franchiseModal() : "";
        if (modal === "login") {
          const option = document.createElement("label");
          option.innerHTML = `<input type="radio" name="role" value="platform-admin"> Platform admin`;
          document.querySelector(".role-select")?.append(option);
          document.querySelector(".form-help")?.insertAdjacentHTML("beforeend", "<br>Platform admin: <strong>platform@example.com</strong> / <strong>platform123</strong>");
          document.querySelector(".form-help")?.insertAdjacentHTML("beforeend", "<br>Juniper Table: <strong>juniper@example.com</strong> / <strong>juniper123</strong><br>Harbor &amp; Hearth: <strong>harbor@example.com</strong> / <strong>harbor123</strong>");
        }
      }
      function pageHead(kicker, title, description, actions = "") { return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>${actions ? `<div class="toolbar">${actions}</div>` : ""}</div>`; }
      function renderView() {
        if (view === "menu") return renderMenu();
        if (["cart", "orders"].includes(view) && !user) return `<div class="empty"><strong>Sign in to continue</strong>Your cart and orders are connected to your customer account.<br><button class="btn btn-primary" data-action="login" style="margin-top:14px">Sign in or create account</button></div>`;
        if (view === "cart") return renderCart();
        if (view === "orders") return renderOrders();

      function renderMenu() {
        const categories = ["All items", ...new Set(products.filter(item => item.active).map(item => item.category))];
        return `<div class="welcome"><div class="welcome-copy"><div class="eyebrow">Good food. Good company.</div><h2>A little more joy at the table.</h2><p>Seasonal plates, warm bread, and the kind of welcome that makes you stay awhile.</p><button class="btn btn-primary" data-action="scroll-menu">Explore today's menu ↓</button></div><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=80" alt="A table set for dinner"></div>${pageHead("Made fresh today", "From our kitchen", "Seasonal favorites, prepared with care.", `<input class="search" type="search" placeholder="Search the menu" value="${esc(searchTerm)}" aria-label="Search menu">`)}<div class="filters">${categories.map(item => `<button class="filter ${category === item ? "active" : ""}" data-category="${esc(item)}">${esc(item)}</button>`).join("")}</div><div class="menu-grid">${menuItems().map(product => `<article class="product"><img class="product-image" src="${esc(product.image)}" alt="${esc(product.name)}" loading="lazy"><div class="product-body"><div class="product-meta"><h3>${esc(product.name)}</h3><span class="product-price">${money(product.price)}</span></div><p>${esc(product.description)}</p><div class="product-foot"><span class="tag">${esc(product.tag || product.category)}</span><button class="btn btn-primary btn-small" data-action="add" data-id="${esc(product.id)}">Add to cart</button></div></div></article>`).join("") || `<div class="empty" style="grid-column:1/-1">No menu items match this search.</div>`}</div>`;
      }
      function renderCart() {
        const rows = cart.map(item => { const product = products.find(entry => entry.id === item.id); return product ? `<div class="cart-row"><img src="${esc(product.image)}" alt=""><div><h3>${esc(product.name)}</h3><p>${money(product.price)} each</p></div><div class="qty"><button data-action="qty" data-id="${esc(item.id)}" data-delta="-1" aria-label="Remove one">−</button><strong>${item.qty}</strong><button data-action="qty" data-id="${esc(item.id)}" data-delta="1" aria-label="Add one">+</button></div><strong class="row-price">${money(product.price * item.qty)}</strong></div>` : ""; }).join("");
        return `${pageHead("Ready when you are", "Your cart", "Review your order before checkout.")}${cart.length ? `<div class="cart-layout"><div class="panel">${rows}<button class="btn btn-quiet btn-small" data-view="menu" style="margin-top:12px">← Continue browsing</button></div><aside class="panel"><h2 style="font:600 19px 'Playfair Display',serif;margin:0 0 12px">Order summary</h2><div class="summary-line"><span>Subtotal</span><strong>${money(subtotal())}</strong></div><div class="summary-line"><span>Pickup</span><span>Free</span></div><div class="summary-line summary-total"><span>Total</span><strong>${money(subtotal())}</strong></div><button class="btn btn-primary" data-action="checkout" style="width:100%;margin-top:15px">Continue to checkout</button><p style="font-size:10px;color:var(--muted);margin:10px 0 0">Demo checkout; no payment is collected.</p></aside></div>` : `<div class="empty"><strong>Your cart is ready for something good.</strong>Browse the menu and add a favorite.<br><button class="btn btn-primary" data-view="menu" style="margin-top:14px">Browse menu</button></div>`}`;
      }
      function renderOrders() {
        const mine = visibleOrders().slice().reverse();
        return `${pageHead(user?.role === "admin" ? "Kitchen activity" : "Your account", user?.role === "admin" ? "All orders" : "Your orders", user?.role === "admin" ? "Track orders, confirm manual payments, and share rider tracking." : "Order updates and pickup details in one place.")}${mine.length ? `<div class="order-list">${mine.map(order => `<article class="order-card"><div><h3>Order ${esc(order.id)}</h3><p>${new Date(order.createdAt).toLocaleString()} · ${order.items.map(item => `${item.qty} × ${esc(item.name)}`).join(", ")}</p>${user?.role === "admin" ? `<p>${esc(order.name)} · ${esc(order.email)}</p>` : ""}<p>Payment: <span class="status ${order.paymentStatus === "Paid" ? "" : "pending"}">${esc(order.paymentStatus || "Awaiting payment")}</span></p>${user?.role === "admin" ? `<div class="order-tools"><button class="btn btn-small" data-action="confirm-payment" data-order="${esc(order.id)}" ${order.paymentStatus === "Paid" ? "disabled" : ""}>${order.paymentStatus === "Paid" ? "Payment confirmed" : "Confirm payment"}</button><form class="rider-form" data-order="${esc(order.id)}"><input name="riderUrl" type="url" required placeholder="Paste rider tracking link" value="${esc(order.riderUrl || "")}" aria-label="Rider tracking link"><button class="btn btn-small" type="submit">Save rider link</button></form></div>` : order.paymentStatus === "Paid" && order.riderUrl ? `<a class="btn btn-primary btn-small" href="${esc(order.riderUrl)}" target="_blank" rel="noopener noreferrer">Track your rider ↗</a>` : order.paymentStatus === "Paid" ? `<p>Your payment is confirmed. Your rider link will appear here.</p>` : `<a class="btn btn-primary btn-small" href="${esc(whatsappLink(order))}" target="_blank" rel="noopener noreferrer">Pay via WhatsApp ↗</a>`}</div><div><div class="order-total">${money(order.total)}</div><span class="status ${statusClass(order.status)}">${esc(order.status)}</span>${user?.role === "admin" ? `<select class="order-status" data-order="${esc(order.id)}" aria-label="Update order status" style="display:block;margin-top:8px;padding:5px;border:1px solid var(--line);border-radius:4px"><option ${order.status === "Pending" ? "selected" : ""}>Pending</option><option ${order.status === "Preparing" ? "selected" : ""}>Preparing</option><option ${order.status === "Ready for pickup" ? "selected" : ""}>Ready for pickup</option><option ${order.status === "Completed" ? "selected" : ""}>Completed</option><option ${order.status === "Cancelled" ? "selected" : ""}>Cancelled</option></select>` : ""}</div></article>`).join("")}</div>` : `<div class="empty"><strong>No orders yet</strong>Your placed orders will show up here.<br><button class="btn btn-primary" data-view="menu" style="margin-top:14px">Explore the menu</button></div>`}`;
      }
      function renderDashboard() {
        const revenue = orders.filter(order => order.status !== "Cancelled").reduce((sum, order) => sum + order.total, 0);
        const pending = orders.filter(order => ["Pending", "Preparing"].includes(order.status)).length;
        const latest = orders.slice().reverse().slice(0, 5);
        return `${pageHead("Kitchen overview", "Good morning, " + esc(user.name.split(' ')[0]) + ".", "A quick look at today's restaurant activity.", `<button class="btn" data-view="products">Manage menu</button>`)}<div class="stats"><div class="stat"><div class="stat-label">Total orders</div><div class="stat-value">${orders.length}</div><div class="stat-foot">Across all customers</div></div><div class="stat"><div class="stat-label">Needs attention</div><div class="stat-value">${pending}</div><div class="stat-foot">Pending or preparing</div></div><div class="stat"><div class="stat-label">Gross sales</div><div class="stat-value">${money(revenue)}</div><div class="stat-foot">Excludes cancelled orders</div></div><div class="stat"><div class="stat-label">Active menu items</div><div class="stat-value">${products.filter(item => item.active).length}</div><div class="stat-foot">${products.filter(item => item.stock <= 5 && item.active).length} running low</div></div></div><section class="panel whatsapp-settings"><div><h2>WhatsApp payments</h2><p>Customers will message this number to arrange manual payment.</p></div><form id="whatsapp-settings-form"><label for="whatsapp-phone">Admin WhatsApp number</label><div class="toolbar"><input id="whatsapp-phone" name="phone" type="tel" required placeholder="Country code + number" value="${esc(settings.whatsappPhone)}"><button class="btn btn-primary" type="submit">Save number</button></div><small>Include your country code, for example 15551234567.</small></form></section><div class="page-head" style="margin:25px 0 13px"><div><h2 style="font:600 21px 'Playfair Display',serif;margin:0">Recent orders</h2></div><button class="btn btn-small" data-view="orders">View all orders →</button></div>${latest.length ? `<div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Placed</th><th>Total</th><th>Status</th></tr></thead><tbody>${latest.map(order => `<tr><td><strong>${esc(order.id)}</strong></td><td>${esc(order.name)}</td><td>${new Date(order.createdAt).toLocaleDateString()}</td><td>${money(order.total)}</td><td><span class="status ${statusClass(order.status)}">${esc(order.status)}</span></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty"><strong>No orders to show</strong>Customer orders will appear here after checkout.</div>`}`;
      }
      function renderProducts() {
        const rows = products.map(product => `<tr><td><div class="admin-product"><img src="${esc(product.image)}" alt=""><strong>${esc(product.name)}</strong></div></td><td>${esc(product.category)}</td><td>${money(product.price)}</td><td>${product.stock}</td><td><span class="status ${product.active ? "" : "cancelled"}">${product.active ? "Available" : "Hidden"}</span></td><td><button class="btn btn-small" data-action="edit-product" data-id="${esc(product.id)}">Edit</button> <button class="btn btn-small btn-danger" data-action="delete-product" data-id="${esc(product.id)}">${product.active ? "Hide" : "Show"}</button></td></tr>`).join("");
        return `${pageHead("Your menu", "Menu items", `${products.length} items · changes are saved in this browser.`, `<button class="btn btn-primary" data-action="new-product">＋ Add item</button>`)}<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Stock</th><th>Visibility</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      function renderFranchises() {
        const rows = franchises.map(franchise => `<tr><td><strong>${esc(franchise.name)}</strong></td><td>${esc(franchise.adminEmail)}</td><td>${franchise.products.length}</td><td>${franchise.orders.length}</td><td>${franchise.whatsappPhone ? `+${esc(franchise.whatsappPhone)}` : "Not set"}</td><td><button class="btn btn-small" data-action="switch-franchise" data-id="${esc(franchise.id)}">Open storefront</button></td></tr>`).join("");
        return `${pageHead("Platform workspace", "Franchises", "Create restaurant accounts and keep each franchise's menu and orders separate.", `<button class="btn btn-primary" data-action="new-franchise">＋ Add franchise</button>`)}<div class="stats"><div class="stat"><div class="stat-label">Restaurant accounts</div><div class="stat-value">${franchises.length}</div><div class="stat-foot">Each has a separate admin sign-in</div></div><div class="stat"><div class="stat-label">Menu items</div><div class="stat-value">${franchises.reduce((sum, franchise) => sum + franchise.products.length, 0)}</div><div class="stat-foot">Across all restaurants</div></div><div class="stat"><div class="stat-label">Orders</div><div class="stat-value">${franchises.reduce((sum, franchise) => sum + franchise.orders.length, 0)}</div><div class="stat-foot">Stored by franchise</div></div><div class="stat"><div class="stat-label">Payment contacts</div><div class="stat-value">${franchises.filter(franchise => franchise.whatsappPhone).length}</div><div class="stat-foot">WhatsApp numbers configured</div></div></div><div class="table-wrap"><table><thead><tr><th>Restaurant</th><th>Admin login</th><th>Menu</th><th>Orders</th><th>WhatsApp</th><th>Storefront</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      function franchiseModal() {
        return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="franchise-title"><div class="modal-head"><div><div class="eyebrow">Platform workspace</div><h2 id="franchise-title">Add franchise</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><form class="form" id="franchise-form"><div class="field"><label for="franchise-name">Restaurant name</label><input id="franchise-name" name="name" required maxlength="60" placeholder="e.g. Juniper Table"></div><div class="field"><label for="franchise-email">Franchise admin email</label><input id="franchise-email" name="email" type="email" required placeholder="owner@restaurant.com"></div><div class="field"><label for="franchise-password">Temporary demo password</label><input id="franchise-password" name="password" type="text" minlength="6" required placeholder="At least 6 characters"></div><div class="form-help">The new admin starts with an empty menu and independent orders and WhatsApp settings.</div><button class="btn btn-primary" type="submit">Create franchise account</button></form></section></div>`;
      }
      function loginModal() {
        return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title"><div class="login-mark">G</div><div class="modal-head"><div><div class="eyebrow">Gather &amp; Grain</div><h2 id="login-title">Welcome back</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><form class="form" id="login-form"><div class="role-select"><label><input type="radio" name="role" value="customer" checked> Customer</label><label><input type="radio" name="role" value="admin"> Admin</label></div><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" required placeholder="Your password"></div><div class="form-error" id="login-error"></div><div class="form-help">Demo sign-ins<br>Customer: <strong>customer@example.com</strong> / <strong>customer123</strong><br>Admin: <strong>admin@example.com</strong> / <strong>admin123</strong><br><span style="color:#8a6758">Demo only: accounts are not securely authenticated.</span></div><button class="btn btn-primary" type="submit">Sign in</button><button class="btn" type="button" data-action="signup">Create customer account</button></form></section></div>`;
      }
      function checkoutModal() {
        return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="checkout-title"><div class="modal-head"><div><div class="eyebrow">Pickup order</div><h2 id="checkout-title">Almost yours</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><form class="form" id="checkout-form"><div class="field"><label for="pickup-name">Name</label><input id="pickup-name" name="name" required value="${esc(user?.name || "")}"></div><div class="field"><label for="pickup-time">Pickup time</label><select id="pickup-time" name="pickup" required><option>As soon as possible (30-40 min)</option><option>In about 1 hour</option><option>In about 2 hours</option></select></div><div class="field"><label for="order-notes">Notes for the kitchen</label><textarea id="order-notes" name="notes" placeholder="Allergies or special requests"></textarea></div><div class="summary-line summary-total"><span>Total · ${cartCount()} items</span><strong>${money(subtotal())}</strong></div><div class="form-help">This is a demo checkout. It does not collect payment or send orders to a restaurant.</div><button class="btn btn-primary" type="submit">Place demo order · ${money(subtotal())}</button></form></section></div>`;
      }
      function productModal() {
        const product = products.find(item => item.id === modal.split(":")[1]);
        const isEdit = Boolean(product);
        return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="product-title"><div class="modal-head"><div><div class="eyebrow">Menu management</div><h2 id="product-title">${isEdit ? "Edit item" : "Add menu item"}</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><form class="form" id="product-form"><input type="hidden" name="id" value="${esc(product?.id || "")}"><div class="field"><label>Item name</label><input name="name" required value="${esc(product?.name || "")}"></div><div class="field"><label>Description</label><textarea name="description" required>${esc(product?.description || "")}</textarea></div><div class="field"><label>Image URL</label><input name="image" type="url" required value="${esc(product?.image || "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80")}"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Category</label><input name="category" required value="${esc(product?.category || "Mains")}"></div><div class="field"><label>Price (USD)</label><input name="price" type="number" min="0.01" step="0.01" required value="${esc(product?.price ?? "")}"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" step="1" required value="${esc(product?.stock ?? 10)}"></div><div class="field"><label>Menu label</label><input name="tag" value="${esc(product?.tag || "")}" placeholder="Seasonal"></div></div><button class="btn btn-primary" type="submit">${isEdit ? "Save changes" : "Add menu item"}</button></form></section></div>`;
      }
      function toast(message) {
        const root = document.getElementById("toast-root"); root.innerHTML = `<div class="toast">${esc(message)}</div>`;
        setTimeout(() => { root.innerHTML = ""; }, 2500);
      }
      function addToCart(id) {
        if (!user || user.role !== "customer") { modal = "login"; render(); toast("Sign in as a customer to add items."); return; }
        const product = products.find(item => item.id === id);
        if (!product || !product.active) return;
        const item = cart.find(entry => entry.id === id);
        if (item) { if (item.qty >= product.stock) { toast("That's all we have in stock."); return; } item.qty += 1; }
        else cart.push({ id, qty: 1 });
        persist(); render(); toast(`${product.name} added to cart.`);
      }
      document.addEventListener("click", event => {
        const target = event.target.closest("[data-view],[data-action],[data-category]");
        if (!target) return;
        if (target.dataset.view) { view = target.dataset.view; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
        if (target.dataset.category) { category = target.dataset.category; render(); return; }
        const action = target.dataset.action;
        if (action === "login") { modal = "login"; render(); }
        if (action === "close-modal") { modal = ""; render(); }
        if (action === "logout") { user = null; localStorage.removeItem(STORAGE.user); view = "menu"; render(); toast("You are signed out."); }
        if (action === "add") addToCart(target.dataset.id);
        if (action === "qty") { const item = cart.find(entry => entry.id === target.dataset.id); if (item) { item.qty += Number(target.dataset.delta); if (item.qty <= 0) cart = cart.filter(entry => entry.id !== item.id); persist(); render(); } }
        if (action === "checkout") { modal = "checkout"; render(); }
        if (action === "confirm-payment") { const order = orders.find(item => item.id === target.dataset.order); if (order) { order.paymentStatus = "Paid"; order.paidAt = new Date().toISOString(); persist(); render(); toast("Payment confirmed. Add the rider link to release tracking to the customer."); } }
        if (action === "new-franchise") { modal = "franchise"; render(); }
        if (action === "switch-franchise") { if (activateFranchise(target.dataset.id)) { view = "menu"; category = "All items"; searchTerm = ""; render(); toast(`Previewing ${currentFranchise().name}.`); } }
        if (action === "scroll-menu") document.querySelector(".filters")?.scrollIntoView({ behavior: "smooth", block: "start" });
        if (action === "new-product") { modal = "product"; render(); }
        if (action === "edit-product") { modal = `product:${target.dataset.id}`; render(); }
        if (action === "delete-product") { const item = products.find(entry => entry.id === target.dataset.id); if (item) { item.active = !item.active; persist(); render(); toast(item.active ? "Item is visible on the menu." : "Item hidden from the menu."); } }
        if (action === "signup") { document.querySelector('input[name="role"][value="customer"]').checked = true; document.getElementById("login-email").value = ""; document.getElementById("login-password").value = ""; document.getElementById("login-error").textContent = "Use the customer demo account above. Account creation requires a secure backend."; }
      });
      document.addEventListener("input", event => {
        if (event.target.matches(".search")) { searchTerm = event.target.value; const start = event.target.selectionStart; render(); const field = document.querySelector(".search"); field?.focus(); field?.setSelectionRange(start, start); }
      });
      document.addEventListener("change", event => {
        if (event.target.matches(".franchise-select")) { activateFranchise(event.target.value); view = "menu"; category = "All items"; searchTerm = ""; render(); }
        if (event.target.matches(".order-status")) { const order = orders.find(item => item.id === event.target.dataset.order); if (order) { order.status = event.target.value; persist(); render(); toast("Order status updated."); } }
      });
      document.addEventListener("submit", event => {
        event.preventDefault(); const data = new FormData(event.target);
        if (event.target.getAttribute("id") === "whatsapp-settings-form") {
          const phone = String(data.get("phone") || "").replace(/\D/g, "");
          if (phone.length < 8) { toast("Enter a WhatsApp number with its country code."); return; }
          settings.whatsappPhone = phone; persist(); render(); toast("WhatsApp payment number saved.");
        }
        if (event.target.matches(".rider-form")) {
          const order = orders.find(item => item.id === event.target.dataset.order);
          try {
            const riderUrl = new URL(String(data.get("riderUrl") || ""));
            if (!order || !["http:", "https:"].includes(riderUrl.protocol)) { toast("Use a valid rider tracking link."); return; }
            order.riderUrl = riderUrl.href; persist(); render(); toast("Rider tracking link saved.");
          } catch { toast("Use a valid rider tracking link."); }
        }
        if (event.target.getAttribute("id") === "franchise-form") {
          const name = String(data.get("name")).trim();
          const email = String(data.get("email")).trim().toLowerCase();
          const password = String(data.get("password"));
          if (franchises.some(franchise => franchise.adminEmail.toLowerCase() === email)) { toast("That admin email already belongs to a franchise."); return; }
          const id = `franchise-${Date.now()}`;
          franchises.push({ id, name, adminEmail: email, adminPassword: password, products: [], orders: [], whatsappPhone: "", cart: [] });
          localStorage.setItem(franchiseStorage, JSON.stringify(franchises)); modal = ""; render(); toast(`${name} franchise created. Admin: ${email}`);
        }
        if (event.target.id === "login-form") {
          const role = data.get("role"), email = String(data.get("email")).trim().toLowerCase(), password = data.get("password");
          const franchise = role === "admin" ? franchises.find(item => item.adminEmail.toLowerCase() === email && item.adminPassword === password) : null;
          const accepted = role === "platform-admin" ? email === "platform@example.com" && password === "platform123" : role === "admin" ? Boolean(franchise) : role === "customer" && email === "customer@example.com" && password === "customer123";
          if (!accepted) { document.getElementById("login-error").textContent = "That demo email and password do not match."; return; }
          if (franchise) activateFranchise(franchise.id);
          user = { role, email, name: role === "platform-admin" ? "Platform Admin" : role === "admin" ? `${franchise.name} Admin` : "Jordan Rivera", ...(franchise ? { franchiseId: franchise.id } : {}) };
          localStorage.setItem(STORAGE.user, JSON.stringify(user)); modal = ""; view = role === "platform-admin" ? "franchises" : role === "admin" ? "dashboard" : "menu"; render(); toast(`Signed in as ${role === "admin" ? "franchise admin" : role}.`);
        }
        if (event.target.id === "checkout-form") {
          if (!cart.length) return;
          const name = String(data.get("name")).trim();
          const items = cart.map(entry => { const product = products.find(item => item.id === entry.id); return product ? { id: product.id, name: product.name, price: product.price, qty: entry.qty } : null; }).filter(Boolean);
          if (!items.length) return;
          items.forEach(item => { const product = products.find(entry => entry.id === item.id); if (product) product.stock = Math.max(0, product.stock - item.qty); });
          orders.push({ id: `GG-${String(Date.now()).slice(-6)}`, franchiseId: activeFranchiseId, email: user.email, name, items, total: items.reduce((sum, item) => sum + item.price * item.qty, 0), status: "Pending", paymentStatus: "Awaiting payment", riderUrl: "", pickup: data.get("pickup"), notes: String(data.get("notes") || "").trim(), createdAt: new Date().toISOString() });
          cart = []; modal = ""; view = "orders"; persist(); render(); toast("Your demo order has been placed.");
        }
        if (event.target.getAttribute("id") === "product-form") {
          const id = String(data.get("id") || ""); const existing = products.find(item => item.id === id);
          const updated = { id: existing?.id || `p${Date.now()}`, name: String(data.get("name")).trim(), description: String(data.get("description")).trim(), image: String(data.get("image")).trim(), category: String(data.get("category")).trim(), price: Number(data.get("price")), stock: Number(data.get("stock")), tag: String(data.get("tag")).trim(), active: existing?.active ?? true };
          if (existing) Object.assign(existing, updated); else products.push(updated);
          modal = ""; persist(); render(); toast(existing ? "Menu item updated." : "Menu item added.");
        }
      });
      if (user && !["customer", "admin", "platform-admin"].includes(user.role)) { user = null; localStorage.removeItem(STORAGE.user); }
      render();
    })();
  </script>
</body>
</html>
