<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <title>Community Food Hub</title>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans pb-32 transition-colors min-h-screen">


  <!-- App Header -->
  <header class="bg-emerald-600 dark:bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center transition-colors">
    <div>
      <h1 class="text-base md:text-lg font-bold">Community Food Hub 🍽️</h1>
      <p class="text-xs text-emerald-100 dark:text-slate-400" id="user-role-banner">Please log in to start</p>
    </div>
    <div class="flex gap-2 items-center">
      <button onclick="toggleDarkMode()" class="bg-emerald-700 dark:bg-slate-800 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold shadow">🌓 Theme</button>
      <button id="logout-btn" onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hidden">Logout</button>
    </div>
  </header>


  <!-- Main Container -->
  <main class="max-w-2xl mx-auto p-4" id="app-container">
    
    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="max-w-md mx-auto mt-10 bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-sm border dark:border-slate-800 transition-colors">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🍽️</div>
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Community Food Hub</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">Order from local community kitchens instantly</p>
      </div>


      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Email Address</label>
          <input type="email" id="login-email" placeholder="andymk108@gmail.com or chef.mario@gmail.com" class="w-full p-3 border dark:border-slate-700 rounded-xl text-xs bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
        </div>
        <button onclick="loginUser()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs shadow transition">Log In to App</button>
      </div>
    </div>
  </main>


  <!-- FLOATING STICKY CART BAR -->
  <div id="floating-cart" class="fixed bottom-0 left-0 right-0 bg-emerald-600 dark:bg-emerald-800 text-white p-4 shadow-lg transform translate-y-full transition-transform duration-300 z-40 flex justify-between items-center max-w-2xl mx-auto rounded-t-2xl">
    <div>
      <p class="text-xs font-medium text-emerald-100" id="floating-cart-count">0 items in cart</p>
      <p class="text-base font-extrabold" id="floating-cart-total">₱0</p>
    </div>
    <button onclick="scrollToCart()" class="bg-white text-emerald-700 px-5 py-2.5 rounded-xl font-extrabold text-xs shadow hover:bg-emerald-50 transition">View Cart & Checkout 🛒</button>
  </div>


  <!-- CHECKOUT MODAL -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 max-w-md w-full p-6 rounded-2xl shadow-xl space-y-4 border dark:border-slate-800">
      <div class="flex justify-between items-center border-b dark:border-slate-800 pb-3">
        <h3 class="font-bold text-base text-slate-900 dark:text-white">Confirm Order Details</h3>
        <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
      </div>
      
      <div class="space-y-3 text-xs">
        <div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl space-y-1">
          <p class="font-bold text-slate-700 dark:text-slate-300">Payment Method: <span class="text-emerald-600 dark:text-emerald-400">Cash on Delivery / Manual Pay</span></p>
          <p class="text-slate-500">Your order will be sent straight to the kitchen for preparation.</p>
        </div>


        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
          <input type="text" id="modal-name" class="w-full p-2.5 border dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
          <input type="text" id="modal-phone" class="w-full p-2.5 border dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Delivery Address</label>
          <input type="text" id="modal-address" class="w-full p-2.5 border dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
        </div>
      </div>


      <button onclick="confirmCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-extrabold text-xs shadow transition">Place Order to Kitchen 🚀</button>
    </div>
  </div>


  <script>
    // ⚠️ PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE ⚠️
    const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";


    let appData = {};
    let currentUserEmail = localStorage.getItem('communityUserEmail') || "";
    let cart = [];
    let selectedCategory = 'All';


    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }


    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }


    window.addEventListener('DOMContentLoaded', () => {
      if (currentUserEmail) {
        fetchAppData(currentUserEmail);
      }
    });


    function loginUser() {
      const emailInput = document.getElementById('login-email').value.trim();
      if(!emailInput) return alert("Please enter your email.");
      currentUserEmail = emailInput;
      localStorage.setItem('communityUserEmail', currentUserEmail);
      fetchAppData(currentUserEmail);
    }


    function logout() {
      localStorage.removeItem('communityUserEmail');
      currentUserEmail = "";
      appData = {};
      cart = [];
      location.reload();
    }


    function fetchAppData(email) {
      fetch(API_URL + "?action=getData&email=" + encodeURIComponent(email))
        .then(res => res.json())
        .then(data => {
          appData = (data && typeof data === 'object') ? data : { menu: [], restaurants: [], orders: [], user: { Email: email, Role: 'Customer' } };
          const authScreen = document.getElementById('auth-screen');
          if(authScreen) authScreen.style.display = 'none';
          const logoutBtn = document.getElementById('logout-btn');
          if(logoutBtn) logoutBtn.classList.remove('hidden');
          renderApp();
        })
        .catch(err => {
          alert("Error connecting to Google Sheet API: " + err);
        });
    }


    function renderApp() {
      const container = document.getElementById('app-container');
      const role = appData.user.Role || 'Customer';
      document.getElementById('user-role-banner').innerText = `{role})`;


      if (role.toLowerCase() === 'owner') {
        renderOwnerApp(container);
      } else {
        renderCustomerApp(container);
      }
    }


    function renderCustomerApp(container) {
      let html = '<div class="space-y-6">';


      // Search Bar
      html += '<div class="relative"><input type="text" id="search-input" oninput="filterMenuCards(this.value)" placeholder="🔍 Search restaurants or food items..." class="w-full p-3.5 pl-4 bg-white dark:bg-slate-900 border dark:border-slate-800 rounded-2xl text-xs shadow-sm text-slate-900 dark:text-white"></div>';


      // Partner Restaurants
      const restaurants = appData.restaurants || [];
      html += '<h2 class="text-xl font-bold text-slate-900 dark:text-white">Partner Restaurants</h2><div class="grid grid-cols-1 gap-3">';
      if (restaurants.length === 0) {
        html += '<p class="text-xs text-slate-400">No partner restaurants found.</p>';
      } else {
        restaurants.forEach(r => {
          let isOpen = String(r.Status || '').toUpperCase().trim() === 'OPEN';
          html += '<div class="restaurant-card bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm flex justify-between items-center border-l-4 ' + (isOpen ? 'border-emerald-500':'border-red-400') + ' dark:border-slate-800" data-name="' + (r.RestaurantName || '').toLowerCase() + '">';
          html += '<div><h3 class="font-bold text-base text-slate-900 dark:text-white">' + (r.RestaurantName || 'Restaurant') + '</h3>';
          html += '<p class="text-xs text-slate-500 dark:text-slate-400">' + (isOpen ? '🟢 Open for Orders' : '🔴 Closed for the Day') + '</p></div>';
          html += '<span class="text-xs px-2.5 py-1 rounded-full font-bold ' + (isOpen ? 'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800') + '">' + (r.Status || 'CLOSED') + '</span></div>';
        });
      }
      html += '</div>';


      // Categories
      const menu = appData.menu || [];
      let categories = ['All'];
      menu.forEach(i => {
        let cat = i.Category ? String(i.Category).trim() : 'Others';
        if (!categories.includes(cat)) categories.push(cat);
      });


      html += '<div class="mt-6"><h2 class="text-xl font-bold text-slate-900 dark:text-white mb-3">Explore Menu</h2>';
      html += '<div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">';
      categories.forEach(cat => {
        let active = selectedCategory === cat;
        html += '<button onclick="filterCategory(\'' + cat + '\')" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ' + (active ? 'bg-emerald-600 text-white shadow' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border dark:border-slate-800') + '">' + cat + '</button>';
      });
      html += '</div></div>';


      // Menu Cards
      html += '<div class="grid grid-cols-1 gap-4 mt-3" id="menu-items-grid">';
      if (menu.length === 0) {
        html += '<p class="text-xs text-slate-400">No menu items found.</p>';
      } else {
        menu.forEach(item => {
          let isAvailable = String(item.Available || 'TRUE').toUpperCase().trim() === 'TRUE';
          let itemCat = item.Category ? String(item.Category).trim() : 'Others';


          if(isAvailable && (selectedCategory === 'All' || selectedCategory === itemCat)) {
            let cartItem = cart.find(c => c.item.ItemID === item.ItemID);
            let qty = cartItem ? cartItem.qty : 0;


            html += '<div class="menu-card bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm flex gap-4 items-center border dark:border-slate-800" data-name="' + (item.Name || '').toLowerCase() + '" data-resto="' + (item.RestaurantName || '').toLowerCase() + '" data-desc="' + (item.Description || '').toLowerCase() + '">';
            html += '<img src="' + (item.ImageURL || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c') + '" class="w-20 h-20 object-cover rounded-lg bg-slate-100 dark:bg-slate-800" alt="Food">';
            html += '<div class="flex-1"><span class="text-[10px] bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded-full font-bold">' + (item.RestaurantName || '') + '</span>';
            html += '<h4 class="font-bold text-sm mt-1 text-slate-900 dark:text-white">' + (item.Name || '') + '</h4>';
            html += '<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-1">' + (item.Description || '') + '</p>';
            html += '<div class="flex justify-between items-center mt-2"><span class="font-bold text-emerald-600 dark:text-emerald-400 text-sm">₱' + (item.Price || 0) + '</span>';
            
            if (qty === 0) {
              html += '<button onclick=\'addToCart(' + JSON.stringify(item) + ')\' class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition shadow">Add +</button>';
            } else {
              html += '<div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-lg">';
              html += '<button onclick="decreaseQty(\'' + item.ItemID + '\')" class="w-6 h-6 bg-white dark:bg-slate-700 text-slate-800 dark:text-white rounded font-bold shadow-sm">-</button>';
              html += '<span class="text-xs font-bold px-1">' + qty + '</span>';
              html += '<button onclick=\'addToCart(' + JSON.stringify(item) + ')\' class="w-6 h-6 bg-emerald-600 text-white rounded font-bold shadow-sm">+</button>';
              html += '</div>';
            }
            html += '</div></div></div>';
          }
        });
      }
      html += '</div>';


      // Order Tracker
      html += '<div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 mt-6">';
      html += '<h3 class="text-base font-bold mb-1 text-slate-900 dark:text-white">🔍 Track Your Order & Lalamove Link</h3>';
      html += '<p class="text-xs text-slate-500 dark:text-slate-400 mb-3">Enter your Order ID to monitor preparation and access your Lalamove tracking link.</p>';
      html += '<div class="flex gap-2"><input type="text" id="track-order-id" placeholder="Enter Order ID..." class="flex-1 p-2.5 border dark:border-slate-700 rounded-xl text-xs uppercase font-medium bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">';
      html += '<button onclick="trackOrder()" class="bg-slate-800 dark:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow transition">Track</button></div>';
      html += '<div id="track-result" class="mt-3"></div></div>';


      // Cart Section
      html += '<div id="cart-section" class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border border-emerald-100 dark:border-slate-800 mt-6">';
      html += '<h3 class="text-lg font-bold mb-3 text-slate-900 dark:text-white">🛒 Your Order Cart</h3>';
      html += '<div id="cart-items" class="text-xs text-slate-600 dark:text-slate-400 mb-4 bg-slate-50 dark:bg-slate-800 p-3 rounded-lg">Your cart is currently empty.</div>';
      html += '<button onclick="openCheckoutModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-xl font-extrabold text-sm shadow transition">Proceed to Checkout 🛒</button>';
      html += '</div></div>';


      container.innerHTML = html;
      updateCartDisplay();
    }


    function filterCategory(cat) {
      selectedCategory = cat;
      renderCustomerApp(document.getElementById('app-container'));
    }


    function filterMenuCards(query) {
      const q = query.toLowerCase().trim();
      document.querySelectorAll('.menu-card').forEach(card => {
        const name = card.getAttribute('data-name');
        const resto = card.getAttribute('data-resto');
        const desc = card.getAttribute('data-desc');
        card.style.display = (name.includes(q) || resto.includes(q) || desc.includes(q)) ? 'flex' : 'none';
      });
    }


    function addToCart(item) {
      if(cart.length > 0 && cart[0].item.RestaurantName !== item.RestaurantName) {
        return alert("Please order from one restaurant at a time!");
      }
      let existing = cart.find(c => c.item.ItemID === item.ItemID);
      if (existing) { existing.qty++; } else { cart.push({ item: item, qty: 1 }); }
      renderCustomerApp(document.getElementById('app-container'));
      updateFloatingCart();
    }


    function decreaseQty(itemId) {
      let existing = cart.find(c => c.item.ItemID === itemId);
      if (existing) {
        existing.qty--;
        if (existing.qty <= 0) { cart = cart.filter(c => c.item.ItemID !== itemId); }
      }
      renderCustomerApp(document.getElementById('app-container'));
      updateFloatingCart();
    }


    function updateCartDisplay() {
      const cartDiv = document.getElementById('cart-items');
      if(!cartDiv) return;
      if(cart.length === 0) { cartDiv.innerHTML = "Your cart is currently empty."; return; }
      let total = 0;
      let html = '<ul class="space-y-2 mb-2">';
      cart.forEach((c) => {
        let subtotal = Number(c.item.Price) * c.qty;
        total += subtotal;
        html += '<li class="flex justify-between items-center border-b dark:border-slate-700 pb-1">';
        html += '<span><b>' + c.qty + 'x</b> ' + c.item.Name + '</span>';
        html += '<div class="flex items-center gap-3"><span>₱' + subtotal + '</span>';
        html += '<button onclick="decreaseQty(\'' + c.item.ItemID + '\')" class="text-red-500 font-bold text-xs px-1">✕</button></div></li>';
      });
      html += '</ul><div class="border-t dark:border-slate-700 pt-2 flex justify-between font-bold text-slate-800 dark:text-slate-200 text-sm"><span>Total:</span> <span class="text-emerald-600">₱' + total + '</span></div>';
      cartDiv.innerHTML = html;
    }


    function updateFloatingCart() {
      const floatBar = document.getElementById('floating-cart');
      if (!floatBar) return;
      let totalQty = cart.reduce((sum, c) => sum + c.qty, 0);
      let totalPrice = cart.reduce((sum, c) => sum + (Number(c.item.Price) * c.qty), 0);
      if (totalQty > 0) {
        document.getElementById('floating-cart-count').innerText = totalQty + ' item' + (totalQty > 1 ? 's' : '') + ' in cart';
        document.getElementById('floating-cart-total').innerText = '₱' + totalPrice;
        floatBar.classList.remove('translate-y-full');
      } else {
        floatBar.classList.add('translate-y-full');
      }
    }


    function scrollToCart() {
      document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' });
    }


    function openCheckoutModal() {
      if(cart.length === 0) return alert("Your cart is empty!");
      const u = appData.user || {};
      document.getElementById('modal-name').value = u.Name || '';
      document.getElementById('modal-phone').value = u.Phone || '';
      document.getElementById('modal-address').value = u.Address || '';
      document.getElementById('checkout-modal').classList.remove('hidden');
    }


    function closeCheckoutModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }


    function confirmCheckout() {
      const name = document.getElementById('modal-name').value.trim();
      const phone = document.getElementById('modal-phone').value.trim();
      const address = document.getElementById('modal-address').value.trim();
      if(!name || !phone || !address) return alert("Please fill in your delivery details.");


      const summary = cart.map(c => c.qty + 'x ' + c.item.Name).join(', ');
      const total = cart.reduce((sum, c) => sum + (Number(c.item.Price) * c.qty), 0);
      const restaurantTarget = cart[0].item.RestaurantName;


      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "submitOrder", order: { customerName: name, phone: phone, address: address, restaurantTarget: restaurantTarget, summary: summary, total: total } })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          closeCheckoutModal();
          alert('🎉 Order Placed Successfully!\n\nYour Order ID: ' + res.orderId + '\nPlease save this ID to track your order and Lalamove delivery link.');
          cart = [];
          updateFloatingCart();
          fetchAppData(currentUserEmail);
        }
      });
    }


    function trackOrder() {
      const orderId = document.getElementById('track-order-id').value.trim().toUpperCase();
      const resultDiv = document.getElementById('track-result');
      if(!orderId) return alert("Please enter an Order ID.");
      resultDiv.innerHTML = '<p class="text-xs text-slate-400 py-2">Querying live order status...</p>';


      fetch(API_URL + "?action=checkOrder&orderId=" + encodeURIComponent(orderId))
        .then(res => res.json())
        .then(res => {
          if(!res.success) {
            resultDiv.innerHTML = '<div class="bg-red-50 p-3 rounded-lg border border-red-100 text-xs text-red-600 font-medium">Order ID not found.</div>';
            return;
          }
          const o = res.order;
          let badgeColor = 'bg-amber-100 text-amber-800';
          let riderSection = '<p class="text-slate-500">Awaiting kitchen confirmation & Lalamove link...</p>';
          
          if(o.Status === 'Preparing') { badgeColor = 'bg-blue-100 text-blue-800'; riderSection = '<p class="text-blue-600 font-bold">Kitchen is preparing your meal 🍳</p>'; }
          if(o.Status === 'Ready for Lalamove') {
            badgeColor = 'bg-emerald-100 text-emerald-800';
            if(o.RiderLink) {
              riderSection = '<a href="' + o.RiderLink + '" target="_blank" class="block w-full text-center bg-orange-600 hover:bg-orange-700 text-white font-extrabold py-2.5 rounded-xl shadow transition mt-2">🛵 Click Here to Track Your Lalamove Rider!</a>';
            } else {
              riderSection = '<p class="text-emerald-600 font-bold">Rider dispatched! Tracking link coming soon.</p>';
            }
          }
          if(o.Status === 'Completed') { badgeColor = 'bg-slate-200 text-slate-800'; riderSection = '<p class="font-bold text-slate-700">✅ Order Delivered Successfully</p>'; }


          resultDiv.innerHTML = '<div class="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border dark:border-slate-700 text-xs space-y-2 mt-2">' +
            '<div class="flex justify-between items-center font-bold border-b dark:border-slate-700 pb-2">' +
            '<span>' + o.OrderID + ' (' + o.RestaurantTarget + ')</span>' +
            '<span class="px-2.5 py-1 rounded-full font-bold ' + badgeColor + '">' + o.Status + '</span></div>' +
            '<p><b>Customer:</b> ' + o.CustomerName + '</p>' +
            '<p><b>Items:</b> ' + o.OrderSummary + '</p>' +
            '<p><b>Total Amount:</b> ₱' + o.TotalAmount + '</p>' +
            '<div class="mt-2 pt-2 border-t dark:border-slate-700">' + riderSection + '</div>' +
            '<p class="text-slate-400 text-[11px]">Placed at: ' + o.Timestamp + '</p></div>';
        });
    }


    // Owner Admin Dashboard
    function renderOwnerApp(container) {
      const restoName = appData.user.RestaurantManaged || '';
      const restaurants = appData.restaurants || [];
      const myResto = restaurants.find(r => String(r.RestaurantName || '').trim().toLowerCase() === restoName.toLowerCase());
      const isOpen = myResto ? String(myResto.Status || '').toUpperCase().trim() === 'OPEN' : true;
      const orders = (appData.orders || []).filter(o => String(o.RestaurantTarget || '').trim().toLowerCase() === restoName.toLowerCase());


      let html = '<div class="space-y-6">';
      html += '<div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm flex justify-between items-center border dark:border-slate-800">';
      html += '<div><h2 class="text-lg font-bold text-slate-900 dark:text-white">Admin Dashboard: ' + restoName + '</h2><p class="text-xs text-slate-500">Store Status Control</p></div>';
      html += '<button onclick="toggleStoreStatus(\'' + restoName + '\', \'' + (isOpen ? 'CLOSED':'OPEN') + '\')" class="px-4 py-2 rounded-xl text-xs font-bold shadow ' + (isOpen ? 'bg-red-500 text-white':'bg-emerald-600 text-white') + '">';
      html += (isOpen ? '🔴 Close Store' : '🟢 Open Store') + '</button></div>';


      html += '<div class="bg-white dark:bg-slate-900 p-5 rounded-xl shadow-sm border dark:border-slate-800">';
      html += '<h3 class="text-base font-bold mb-3 text-slate-900 dark:text-white">📦 Incoming Kitchen Orders & Lalamove Links</h3>';


      if(orders.length === 0) {
        html += '<p class="text-xs text-slate-400">No incoming orders yet.</p>';
      } else {
        html += '<div class="space-y-4">';
        orders.slice().reverse().forEach(o => {
          html += '<div class="bg-slate-50 dark:bg-slate-800 p-3.5 rounded-xl border dark:border-slate-700 text-xs space-y-2">';
          html += '<div class="flex justify-between font-bold text-slate-900 dark:text-white"><span>' + o.OrderID + ' (' + o.CustomerName + ')</span><span class="text-emerald-600">₱' + o.TotalAmount + '</span></div>';
          html += '<p class="text-slate-700 dark:text-slate-300"><b>Items:</b> ' + o.OrderSummary + '</p>';
          html += '<p class="text-slate-700 dark:text-slate-300"><b>Address:</b> ' + o.DeliveryAddress + ' (' + o.Phone + ')</p>';
          
          html += '<div class="pt-2 border-t dark:border-slate-700 space-y-1">';
          html += '<label class="block font-bold text-slate-500">Paste Lalamove Tracking Link:</label>';
          html += '<div class="flex gap-2">';
          html += '<input type="text" id="rider-link-' + o.OrderID + '" value="' + (o.RiderLink || '') + '" placeholder="https://www.lalamove.com/share/..." class="flex-1 p-2 border dark:border-slate-700 rounded bg-white dark:bg-slate-900 text-slate-900 dark:text-white">';
          html += '<button onclick="saveRiderLink(\'' + o.OrderID + '\')" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded font-bold">Save Link</button>';
          html += '</div></div>';


          html += '<div class="flex justify-between items-center pt-2 border-t dark:border-slate-700">';
          html += '<span class="font-bold text-slate-500">Status:</span>';
          html += '<select onchange="changeOrderStatus(\'' + o.OrderID + '\', this.value)" class="p-1.5 border dark:border-slate-700 rounded text-xs bg-white dark:bg-slate-900 text-slate-900 dark:text-white font-bold">';
          html += '<option value="Pending" ' + (o.Status === 'Pending' ? 'selected':'') + '>Pending</option>';
          html += '<option value="Preparing" ' + (o.Status === 'Preparing' ? 'selected':'') + '>Preparing</option>';
          html += '<option value="Ready for Lalamove" ' + (o.Status === 'Ready for Lalamove' ? 'selected':'') + '>Ready for Lalamove</option>';
          html += '<option value="Completed" ' + (o.Status === 'Completed' ? 'selected':'') + '>Completed</option>';
          html += '</select></div></div>';
        });
        html += '</div>';
      }
      html += '</div></div>';
      container.innerHTML = html;
    }


    function toggleStoreStatus(restoName, newStatus) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "updateRestaurantStatus", restaurantName: restoName, status: newStatus })
      }).then(() => fetchAppData(currentUserEmail));
    }


    function changeOrderStatus(orderId, status) {
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "updateStatus", orderId: orderId, status: status })
      }).then(res => res.json()).then(res => { if(res.success) alert("Order status updated!"); });
    }


    function saveRiderLink(orderId) {
      const link = document.getElementById('rider-link-' + orderId).value.trim();
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "updateRiderLink", orderId: orderId, riderLink: link })
      }).then(res => res.json()).then(res => { if(res.success) alert("Lalamove tracking link saved successfully!"); });
    }
  </script>
</body>
</html>
